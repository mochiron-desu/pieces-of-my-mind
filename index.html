<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haiku Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>haiku</h1>
            <div class="subtitle-divider"></div>
            <p class="subtitle">A collection of poetry in motion</p>
            <div id="search-container">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search haikus..."
                    aria-label="Search haikus"
                >
            </div>
        </header>

        <main id="haiku-container">
            <div id="loading">Loading<span class="loading-dots">.</span></div>
        </main>
    </div>

    <!-- Modal for Share Card -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close-btn" aria-label="Close" onclick="closeModal()">×</button>
            <div class="modal-header">
                <div class="modal-title">Haiku</div>
                <div class="modal-divider"></div>
            </div>
            <div class="modal-haiku" id="modal-haiku-text"></div>
            <div class="modal-footer">
                <button class="modal-action-btn" onclick="copyToClipboard()">Copy</button>
                <button class="modal-action-btn" onclick="shareHaiku()">Share</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Pieces of My Mind</p>
        <p class="social-links">
            <a href="https://x.com/mochirondesuu" target="_blank" rel="noopener noreferrer">@mochirondesuu</a>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
